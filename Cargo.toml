[package]
name = "a2ui-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
async-channel = "2"
blocking = "1"
chrono = { version = "0.4", features = ["clock"] }
gpui-kit = "0.9"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
unicode-ident = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
